<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proxy Bridge</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
      // Apply theme + detect native shell before paint (avoids flash / double chrome).
      (function () {
        try {
          var saved = localStorage.getItem("pb-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
        if (/ProxyBridgeShell/.test(navigator.userAgent)) {
          document.documentElement.setAttribute("data-shell", "native");
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#nodes">跳到节点列表</a>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="/static/assets/app-icon.png" alt="">
        </div>
        <div>
          <h1>Proxy Bridge</h1>
          <p class="subtitle">订阅节点到本地 SOCKS5</p>
        </div>
      </div>
      <div class="core-strip" id="coreStrip" aria-live="polite"></div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换深色 / 浅色">
        <svg id="themeIconSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main class="workspace">
      <section class="panel import-panel" aria-labelledby="importTitle">
        <div class="panel-title">
          <div class="title-with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h8"/><path d="M8 12h8"/><path d="M9 17h6"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
            <h2 id="importTitle">订阅管理</h2>
          </div>
          <button class="icon-button" id="refreshStatus" type="button" aria-label="刷新状态" title="刷新状态">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12A8 8 0 0 1 17.7 6.4M18 3v4h-4M6 21v-4h4"/></svg>
          </button>
        </div>
        <form id="importForm" class="stack">
          <label>
            <span>名称</span>
            <input name="name" type="text" autocomplete="off" placeholder="我的机场">
          </label>
          <label>
            <span>订阅 URL</span>
            <input name="url" type="url" autocomplete="off" placeholder="https://example.com/sub">
          </label>
          <label>
            <span>原始内容</span>
            <textarea name="raw" rows="7" spellcheck="false" placeholder="vless://..."></textarea>
          </label>
          <button class="primary-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M20 16.5A4.5 4.5 0 0 1 15.5 21h-7A4.5 4.5 0 0 1 4 16.5"/></svg>
            <span>导入订阅</span>
          </button>
        </form>

        <div class="section-divider"><span>已导入</span></div>
        <div class="subscription-list" id="subscriptionList"></div>
      </section>

      <section class="panel nodes-panel" id="nodes" aria-labelledby="nodesTitle">
        <div class="nodes-head">
          <div>
            <div class="title-row">
              <h2 id="nodesTitle">节点列表</h2>
              <span class="countline" id="nodeCount">0 个节点</span>
            </div>
          </div>
          <div class="toolbar">
            <label class="field-inline">
              <span>协议</span>
              <select id="protocolFilter"></select>
            </label>
            <label class="field-inline">
              <span>地区</span>
              <select id="regionFilter"></select>
            </label>
            <label class="search-field">
              <span>搜索</span>
              <input id="searchInput" type="search" autocomplete="off" placeholder="名称 / 服务器">
            </label>
            <button class="ghost-button" id="testVisible" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
              <span>测试可见节点</span>
            </button>
          </div>
        </div>

        <div class="table-shell">
          <table>
            <thead>
              <tr>
                <th>名称</th>
                <th>地区</th>
                <th>协议</th>
                <th>传输</th>
                <th>服务器</th>
                <th>核心</th>
                <th>测试</th>
                <th class="actions-col">操作</th>
              </tr>
            </thead>
            <tbody id="nodeRows"></tbody>
          </table>
          <div class="empty-state" id="emptyNodes">暂无节点</div>
        </div>
        <div class="nodes-footer">
          <span>按筛选结果展示节点，测试会临时启动本地端口。</span>
          <button class="text-button" id="refreshList" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12A8 8 0 0 1 17.7 6.4M18 3v4h-4M6 21v-4h4"/></svg>
            <span>刷新列表</span>
          </button>
        </div>
      </section>

      <aside class="panel bridge-panel" aria-labelledby="bridgesTitle">
        <div class="panel-title">
          <div class="title-with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11V7a6 6 0 0 1 12 0v4"/><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M12 15v2"/></svg>
            <h2 id="bridgesTitle">本地 SOCKS5</h2>
          </div>
          <button class="ghost-button danger" id="stopAll" type="button">全部停止</button>
        </div>
        <div class="bridge-list" id="bridgeList"></div>
      </aside>

      <section class="panel logs-panel" aria-labelledby="logsTitle">
        <div class="logs-head">
          <div class="title-with-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
            <div>
              <h2 id="logsTitle">连接日志</h2>
              <p class="logs-subtitle">显示通过本地 SOCKS5 的 CONNECT 目标、节点、流量和耗时</p>
            </div>
          </div>
          <div class="logs-actions">
            <span class="countline" id="logCount">0 条</span>
            <button class="ghost-button danger" id="clearLogs" type="button" data-action="clear-logs">清空日志</button>
          </div>
        </div>
        <div class="logs-filterbar" aria-label="连接日志筛选">
          <label class="search-field log-search-field">
            <span>搜索</span>
            <input id="logSearchInput" type="search" autocomplete="off" placeholder="目标 / 节点 / 客户端 / 状态">
          </label>
          <label class="field-inline">
            <span>节点</span>
            <select id="logNodeFilter"></select>
          </label>
          <label class="field-inline">
            <span>状态</span>
            <select id="logStatusFilter">
              <option value="all">全部状态</option>
              <option value="connecting">连接中</option>
              <option value="connected">已连接</option>
              <option value="closed">已关闭</option>
              <option value="failed">失败</option>
            </select>
          </label>
          <button class="ghost-button" id="resetLogFilters" type="button" data-action="reset-log-filters">重置</button>
        </div>
        <div class="log-table-shell">
          <table class="log-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>目标</th>
                <th>节点</th>
                <th>客户端</th>
                <th>状态</th>
                <th>流量 / 耗时</th>
              </tr>
            </thead>
            <tbody id="logRows"></tbody>
          </table>
          <div class="empty-state visible" id="emptyLogs">暂无连接日志</div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      // Theme toggle
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById("themeToggle");
        var sun = document.getElementById("themeIconSun");
        var moon = document.getElementById("themeIconMoon");
        function currentTheme() {
          var attr = root.getAttribute("data-theme");
          if (attr) return attr;
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function syncIcon() {
          var t = currentTheme();
          sun.style.display = t === "dark" ? "" : "none";
          moon.style.display = t === "dark" ? "none" : "";
        }
        btn.addEventListener("click", function () {
          var next = currentTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("pb-theme", next); } catch (e) {}
          syncIcon();
        });
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncIcon);
        }
        syncIcon();
      })();
    </script>
    <script src="/static/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proxy Bridge</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
      // 在首帧绘制前应用主题并检测原生外壳,避免闪烁 / 双重窗口边框。
      (function () {
        try {
          var saved = localStorage.getItem("pb-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
          var view = localStorage.getItem("pb-view");
          if (view) document.documentElement.setAttribute("data-initial-view", view);
        } catch (e) {}
        if (/ProxyBridgeShell/.test(navigator.userAgent)) {
          document.documentElement.setAttribute("data-shell", "native");
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">跳到主内容</a>

    <div class="app-shell">
      <!-- ============ 侧边栏(macOS NavigationSplitView 源列表) ============ -->
      <aside class="sidebar" aria-label="主导航">
        <div class="sidebar-brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="/static/assets/app-icon.png" alt="">
          </div>
          <div class="brand-text">
            <strong>Proxy Bridge</strong>
            <span>订阅节点 · 本地 SOCKS5</span>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="视图切换">
          <p class="nav-group-title">通用</p>
          <button class="nav-item" type="button" data-view="nodes" aria-current="true">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="18" r="2.2"/><path d="M8 6h8M6 8v8M18 8v8M8 18h8"/></svg>
            <span class="nav-label">节点</span>
            <span class="nav-count" id="navCountNodes">0</span>
          </button>
          <button class="nav-item" type="button" data-view="subscriptions">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
            <span class="nav-label">订阅</span>
            <span class="nav-count" id="navCountSubs">0</span>
          </button>
          <button class="nav-item" type="button" data-view="bridges">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11V7a6 6 0 0 1 12 0v4"/><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M12 15v2"/></svg>
            <span class="nav-label">本地 SOCKS5</span>
            <span class="nav-count" id="navCountBridges">0</span>
          </button>
          <button class="nav-item" type="button" data-view="logs">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
            <span class="nav-label">连接日志</span>
            <span class="nav-count" id="navCountLogs">0</span>
          </button>
        </nav>

        <!-- 侧边栏底部:代理核心 / 指纹内核状态 + 主题切换 -->
        <div class="sidebar-footer">
          <div class="core-strip" id="coreStrip" aria-live="polite"></div>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色" title="切换深色 / 浅色">
            <svg id="themeIconSun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
            <svg id="themeIconMoon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </aside>

      <!-- ============ 内容区(详情栏) ============ -->
      <main class="content" id="mainContent">
        <!-- ---------- 节点视图 ---------- -->
        <section class="view" data-view="nodes" aria-labelledby="nodesTitle">
          <header class="view-toolbar">
            <div class="view-heading">
              <h1 id="nodesTitle">节点</h1>
              <span class="countline" id="nodeCount">0 个节点</span>
            </div>
            <div class="toolbar-controls">
              <label class="field-inline">
                <span>协议</span>
                <select id="protocolFilter"></select>
              </label>
              <label class="field-inline">
                <span>地区</span>
                <select id="regionFilter"></select>
              </label>
              <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="searchInput" type="search" autocomplete="off" placeholder="搜索名称 / 服务器" aria-label="搜索节点">
              </div>
              <button class="toolbar-button" id="testVisible" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                <span>测试可见节点</span>
              </button>
              <button class="toolbar-button icon-only" id="refreshList" type="button" aria-label="刷新列表" title="刷新列表">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12A8 8 0 0 1 17.7 6.4M18 3v4h-4M6 21v-4h4"/></svg>
              </button>
            </div>
          </header>
          <div class="view-body">
            <div class="table-shell">
              <table>
                <thead>
                  <tr>
                    <th>名称</th>
                    <th>地区</th>
                    <th>协议</th>
                    <th>传输</th>
                    <th>服务器</th>
                    <th>核心</th>
                    <th>测试</th>
                    <th class="actions-col">操作</th>
                  </tr>
                </thead>
                <tbody id="nodeRows"></tbody>
              </table>
              <div class="empty-state" id="emptyNodes">暂无节点</div>
            </div>
          </div>
        </section>

        <!-- ---------- 订阅视图 ---------- -->
        <section class="view" data-view="subscriptions" aria-labelledby="subsTitle" hidden>
          <header class="view-toolbar">
            <div class="view-heading">
              <h1 id="subsTitle">订阅</h1>
              <span class="countline" id="subsCount">0 个订阅</span>
            </div>
            <div class="toolbar-controls">
              <button class="toolbar-button icon-only" id="refreshStatus" type="button" aria-label="刷新状态" title="刷新状态">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12A8 8 0 0 1 17.7 6.4M18 3v4h-4M6 21v-4h4"/></svg>
              </button>
            </div>
          </header>
          <div class="view-body subscriptions-body">
            <form id="importForm" class="import-card">
              <div class="import-card-title">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M20 16.5A4.5 4.5 0 0 1 15.5 21h-7A4.5 4.5 0 0 1 4 16.5"/></svg>
                <h2>导入订阅</h2>
              </div>
              <div class="form-grid">
                <label>
                  <span>名称</span>
                  <input name="name" type="text" autocomplete="off" placeholder="我的机场">
                </label>
                <label>
                  <span>订阅 URL</span>
                  <input name="url" type="url" autocomplete="off" placeholder="https://example.com/sub">
                </label>
              </div>
              <label class="raw-field">
                <span>原始内容</span>
                <textarea name="raw" rows="5" spellcheck="false" placeholder="vless://..."></textarea>
              </label>
              <div class="import-card-actions">
                <button class="primary-button" type="submit">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M20 16.5A4.5 4.5 0 0 1 15.5 21h-7A4.5 4.5 0 0 1 4 16.5"/></svg>
                  <span>导入订阅</span>
                </button>
              </div>
            </form>

            <div class="section-divider"><span>已导入</span></div>
            <div class="subscription-list" id="subscriptionList"></div>
          </div>
        </section>

        <!-- ---------- 本地 SOCKS5 视图 ---------- -->
        <section class="view" data-view="bridges" aria-labelledby="bridgesTitle" hidden>
          <header class="view-toolbar">
            <div class="view-heading">
              <h1 id="bridgesTitle">本地 SOCKS5</h1>
              <span class="countline" id="bridgesCount">0 个运行中</span>
            </div>
            <div class="toolbar-controls">
              <button class="toolbar-button danger" id="stopAll" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/></svg>
                <span>全部停止</span>
              </button>
            </div>
          </header>
          <div class="view-body">
            <div class="bridge-list" id="bridgeList"></div>
          </div>
        </section>

        <!-- ---------- 连接日志视图 ---------- -->
        <section class="view" data-view="logs" aria-labelledby="logsTitle" hidden>
          <header class="view-toolbar">
            <div class="view-heading">
              <h1 id="logsTitle">连接日志</h1>
              <span class="countline" id="logCount">0 条</span>
            </div>
            <div class="toolbar-controls">
              <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="logSearchInput" type="search" autocomplete="off" placeholder="目标 / 节点 / 客户端 / 状态" aria-label="搜索日志">
              </div>
              <label class="field-inline">
                <span>节点</span>
                <select id="logNodeFilter"></select>
              </label>
              <label class="field-inline">
                <span>状态</span>
                <select id="logStatusFilter">
                  <option value="all">全部状态</option>
                  <option value="connecting">连接中</option>
                  <option value="connected">已连接</option>
                  <option value="closed">已关闭</option>
                  <option value="failed">失败</option>
                </select>
              </label>
              <button class="toolbar-button" id="resetLogFilters" type="button" data-action="reset-log-filters">重置</button>
              <button class="toolbar-button danger" id="clearLogs" type="button" data-action="clear-logs">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/></svg>
                <span>清空</span>
              </button>
            </div>
          </header>
          <div class="view-body">
            <p class="view-hint">显示通过本地 SOCKS5 的 CONNECT 目标、节点、流量和耗时。</p>
            <div class="log-table-shell">
              <table class="log-table">
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>目标</th>
                    <th>节点</th>
                    <th>客户端</th>
                    <th>状态</th>
                    <th>流量 / 耗时</th>
                  </tr>
                </thead>
                <tbody id="logRows"></tbody>
              </table>
              <div class="empty-state visible" id="emptyLogs">暂无连接日志</div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ============ 核心日志弹窗 ============ -->
    <div class="modal-backdrop" id="coreLogModal" hidden>
      <section class="core-log-modal" role="dialog" aria-modal="true" aria-labelledby="coreLogTitle" tabindex="-1">
        <header class="modal-head">
          <div>
            <h2 id="coreLogTitle">核心日志</h2>
            <p id="coreLogMeta" class="modal-subtitle"></p>
          </div>
          <button class="icon-button" type="button" data-action="close-core-log" aria-label="关闭日志" title="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </header>
        <div class="core-log-body" id="coreLogBody"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      // 主题切换:在 <html> 上写入 data-theme,并同步太阳 / 月亮图标。
      (function () {
        var root = document.documentElement;
        var btn = document.getElementById("themeToggle");
        var sun = document.getElementById("themeIconSun");
        var moon = document.getElementById("themeIconMoon");
        function currentTheme() {
          var attr = root.getAttribute("data-theme");
          if (attr) return attr;
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        function syncIcon() {
          var t = currentTheme();
          sun.style.display = t === "dark" ? "" : "none";
          moon.style.display = t === "dark" ? "none" : "";
        }
        btn.addEventListener("click", function () {
          var next = currentTheme() === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("pb-theme", next); } catch (e) {}
          syncIcon();
        });
        if (window.matchMedia) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncIcon);
        }
        syncIcon();
      })();
    </script>
    <script src="/static/app.js"></script>
  </body>
</html>
